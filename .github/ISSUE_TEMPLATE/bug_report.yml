name: Bug report
description: Report a reproducible bug in Forge.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! For usage questions or "how do I…", please use [Discussions](https://github.com/adexdsamson/Forge/discussions/categories/q-a) instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one-paragraph description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A minimal code snippet, CodeSandbox/StackBlitz link, or repo that reproduces the bug.
      placeholder: |
        ```tsx
        const { control } = useForge({ ... });
        // ...
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages and stack traces if any.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Web
        - React Native (iOS)
        - React Native (Android)
        - Other
    validations:
      required: true
  - type: input
    id: forge-version
    attributes:
      label: Forge version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: rhf-version
    attributes:
      label: react-hook-form version
      placeholder: "7.50.1"
    validations:
      required: true
  - type: input
    id: react-version
    attributes:
      label: React version
      placeholder: "18.2.0"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Browser/Node versions, RN version, related issues, screenshots, etc.
